<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060b17">
<meta name="description" content="Combat 3D : FPS dans le navigateur — solo, vagues, boss, battle royale et multijoueur.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="Favicon_313.png">
<link rel="apple-touch-icon" href="Favicon_313.png">
<title>Combat 3D FPS - Édition Améliorée</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<div id="lobby">
    <div id="lobbyTop"><span class="logo" id="iconLogo"></span></div>
    <div id="lobbyCoins" class="hudPanel" style="pointer-events:none; margin:10px auto 0; width:fit-content;"><span id="iconCoin2"></span> <span id="lobbyCoinsCount">0</span></div>
    <div id="modeCards"></div>
</div>

<div id="hud">
    <div class="hudPanel">
        <span id="iconHealth"></span>
        <span class="bar"><div id="playerHealth"></div></span>
        <span id="playerHealthNum">100</span>
    </div>
</div>

<div id="topRight">
    <div class="hudPanel"><span id="iconCoin1"></span> <span id="coinsHUD">0</span></div>
    <div class="hudPanel"><span id="iconTrophy1"></span> <span id="score">0</span></div>
    <div class="hudPanel" id="enemyCountPanel"><span id="iconEnemy1"></span> <span id="enemyCount">0</span></div>
    <div class="hudPanel" id="wavePanel" style="display:none"><span id="iconWave1"></span> <span id="wave">1</span></div>
</div>

<div id="targetPanel">
    <div class="hudPanel">
        <span id="iconEnemy2"></span>
        <span class="bar" id="enemyBar"><div id="enemyHealth"></div></span>
        <span id="enemyHealthNum">0</span>
    </div>
</div>

<div id="waveFlash"></div>
<div id="crosshair"></div>
<div id="damageFlash"></div>

<div id="weaponView">
    <div class="gun"><div id="muzzleFlash"></div></div>
</div>

<div id="hotbar"></div>
<div id="lockMessage"><span id="iconMouse"></span></div>

<div id="gameOver">
    <div class="resultIcon" id="resultIcon"></div>
    <div class="statLine" id="statLine"></div>
    <div class="actions">
        <button class="actionBtn" id="btnRestart"><span id="iconReplay"></span>Rejouer</button>
        <button class="actionBtn secondary" id="btnLobby"><span id="iconHome"></span>Salon</button>
    </div>
</div>

<div id="mobileUI">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="touchAimArea"></div>
    <div id="btnWeapon" class="mobileBtn"></div>
    <div id="btnAim" class="mobileBtn"></div>
    <div id="btnView" class="mobileBtn"></div>
    <div id="btnJump" class="mobileBtn">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 4l-6 6h4v10h4V10h4l-6-6z"/></svg>
    </div>
    <div id="btnShoot" class="mobileBtn shootBtn"></div>
</div>

<div id="btnPause"><span id="iconPause"></span></div>

<div id="pauseMenu">
    <div class="resultIcon" id="pauseIcon"></div>
    <div class="statLine">Pause</div>
    <div class="actions">
        <button class="actionBtn" id="btnResume"><span id="iconResume"></span>Reprendre</button>
        <button class="actionBtn secondary" id="btnPauseLobby"><span id="iconHome2"></span>Salon</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

<div id="vig"></div><div id="dmgDir"><i></i></div><div id="killMsg"></div><div id="muteBtn" title="Son (M)">🔊</div>
<div id="boot" role="status" style="position:fixed;inset:0;z-index:9999;background:#0b0e24;color:#fff;display:flex;align-items:center;justify-content:center;font:bold 20px Arial;letter-spacing:4px">CHARGEMENT DES MODÈLES 3D…</div>
<script>
/* Écran de chargement : affiche l'erreur (au lieu de rester bloqué) + bouton Réessayer */
(function(){
  function fail(msg){
    var b=document.getElementById("boot"); if(!b) return;
    b.style.cssText+=";flex-direction:column;gap:16px;text-align:center;padding:24px";
    b.innerHTML="";
    var t=document.createElement("div"); t.textContent="ERREUR DE CHARGEMENT"; t.style.color="#ff6b6b";
    var m=document.createElement("div"); m.textContent=msg; m.style.cssText="font:500 15px Rajdhani,Arial,sans-serif;letter-spacing:1px;max-width:560px;opacity:.85";
    var r=document.createElement("button"); r.textContent="Réessayer"; r.style.cssText="font:700 16px Rajdhani,Arial,sans-serif;letter-spacing:2px;padding:10px 28px;border:0;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer";
    r.onclick=function(){ location.reload(); };
    b.appendChild(t); b.appendChild(m); b.appendChild(r);
  }
  window.c3dBootFail=fail;
  addEventListener("error",function(e){
    var el=e.target, s=e.message||"";
    if(el&&el.tagName==="SCRIPT") fail("Impossible de charger « "+(el.src||"").split("/").slice(-2).join("/")+" ». Vérifie ta connexion puis réessaie.");
    else if(/THREE|Peer/.test(s)) fail("La bibliothèque 3D n'a pas pu être chargée (connexion coupée ou bloqueur de contenu ?).");
    else if(s) fail("Erreur : "+s);
  },true);
  setTimeout(function(){ fail("Le chargement est très long : connexion lente, ou dossier models/ introuvable."); },30000);
})();
</script>
<noscript><div style="position:fixed;inset:0;z-index:10000;background:#0b0e24;color:#fff;display:flex;align-items:center;justify-content:center;font:bold 18px Arial">Active JavaScript pour jouer à Combat 3D.</div></noscript>
<script src="game.js?v=11"></script>
</body>
</html>
